# Publica la versión web en GitHub Pages cada vez que se sube un cambio a la rama main.
# Requiere en GitHub → Settings → Secrets and variables → Actions → Variables:
#   SUPABASE_URL              (Project URL de Supabase)
#   SUPABASE_PUBLISHABLE_KEY  (Publishable key / anon key de Supabase; es pública por diseño)
# y en Settings → Pages → Source: "GitHub Actions".
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Los precios de partida no están en el repositorio (viven en Supabase)
      - run: test -f src/data/seed.json || echo "[]" > src/data/seed.json
      - run: npx tsc --noEmit
      - run: npx expo export -p web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
